<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" fill="none">
  <!-- KRIYA Primary Brand Logo -->
  <g id="kriya-primary-logo">
    <!-- Brand Symbol (Scaled 2.8x) -->
    <g transform="translate(16, 15) scale(2.8)">
      <path d="M 4 6 L 6 4 L 11 4 L 11 28 L 4 28 Z" fill="#C85A3D" />
      <path d="M 9.5 4 L 11 4 L 11 28 L 9.5 28 Z" fill="#A94730" opacity="0.4" />
      
      <!-- Progress Steps -->
      <rect x="12" y="15" width="5" height="4" rx="0.5" fill="#C85A3D" />
      <rect x="17" y="10" width="5" height="5" rx="0.5" fill="#C85A3D" />
      <rect x="22" y="4" width="6" height="6" rx="0.5" fill="#D9A441" />
      <rect x="26" y="2" width="2" height="2" fill="#668F72" />

      <!-- Foundation Steps -->
      <rect x="12" y="19" width="6" height="4" rx="0.5" fill="#A94730" />
      <rect x="18" y="23" width="7" height="5" rx="0.5" fill="#A94730" />
    </g>

    <!-- Wordmark & Typography -->
    <g transform="translate(116, 0)">
      <!-- Main Wordmark "KRIYA" -->
      <text x="0" y="66" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#20231F">KRIYA</text>
      
      <!-- Stepped Accent Dot on Letter A -->
      <rect x="154" y="28" width="6" height="6" fill="#C85A3D" rx="1" />
      
      <!-- Descriptor / Tagline -->
      <text x="2" y="90" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="#70736B">DAILY PROGRESS ENGINE</text>
    </g>
  </g>
</svg>
