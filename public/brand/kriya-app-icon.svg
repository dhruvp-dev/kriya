<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- KRIYA Standalone App Icon Tile -->
  <defs>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#20231F" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C85A3D" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="#FFFDF7" stroke="#DFDDD2" stroke-width="10" filter="url(#tile-shadow)" />
  
  <!-- Subtle Retro Grid Micro Texture -->
  <path d="M 128 32 V 480 M 224 32 V 480 M 320 32 V 480 M 416 32 V 480" stroke="#344653" stroke-opacity="0.03" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 32 128 H 480 M 32 224 H 480 M 32 320 H 480 M 32 416 H 480" stroke="#344653" stroke-opacity="0.03" stroke-width="2" stroke-dasharray="4 4" />

  <!-- KRIYA Stepped Mark Scaled 12x (32px -> 384px inside 512x512 canvas) -->
  <g transform="translate(64, 64) scale(12)">
    <!-- Left Vertical Stem Pillar -->
    <path d="M 4 6 L 6 4 L 11 4 L 11 28 L 4 28 Z" fill="#C85A3D" />
    <path d="M 9.5 4 L 11 4 L 11 28 L 9.5 28 Z" fill="#A94730" opacity="0.4" />
    
    <!-- Ascending Upper Arm (Progress Stair) -->
    <rect x="12" y="15" width="5" height="4" rx="0.5" fill="#C85A3D" />
    <rect x="17" y="10" width="5" height="5" rx="0.5" fill="#C85A3D" />
    <rect x="22" y="4" width="6" height="6" rx="0.5" fill="#D9A441" />
    <rect x="26" y="2" width="2" height="2" fill="#668F72" />

    <!-- Descending Lower Arm (Foundation Base) -->
    <rect x="12" y="19" width="6" height="4" rx="0.5" fill="#A94730" />
    <rect x="18" y="23" width="7" height="5" rx="0.5" fill="#A94730" />
  </g>
</svg>
