    <g transform="translate(16, 15) scale(2.8)">
      <path d="M 4 6 L 6 4 L 11 4 L 11 28 L 4 28 Z" fill="#20231F" />
      <rect x="12" y="15" width="4.5" height="3.5" rx="0.3" fill="#20231F" />
      <rect x="17" y="10" width="4.5" height="4.5" rx="0.3" fill="#20231F" />
      <rect x="22" y="4" width="5.5" height="5.5" rx="0.3" fill="#20231F" />
      <rect x="12" y="19.5" width="5.5" height="3.5" rx="0.3" fill="#20231F" />
      <rect x="18" y="23.5" width="6.5" height="4.5" rx="0.3" fill="#20231F" />
