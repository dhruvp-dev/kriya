<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" fill="none">
  <!-- KRIYA Dark Mode Brand Logo -->
  <rect width="460" height="120" rx="16" fill="#070709" />
  
  <g transform="translate(18, 16) scale(2.75)">
    <!-- 1. Stability Pillar (White) -->
    <rect x="5.5" y="4.5" width="4.5" height="23" rx="2.25" fill="#FFFFFF" />
    
    <!-- 2. Ascending Momentum Vector (Warm Terracotta) -->
    <path d="M 13.5 14.5 L 23.5 4.5" stroke="#E26A4B" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- 3. Foundation Return (Soft White) -->
    <path d="M 13.5 17.5 L 23.5 27.5" stroke="#E6E6E8" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- 4. Action Spark (Gleaming Gold) -->
    <circle cx="26.5" cy="2.5" r="1.5" fill="#F5B731" />
  </g>
  
  <g transform="translate(122, 16)">
    <!-- Wordmark -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">KRIYA</text>
    <circle cx="154" cy="40" r="4" fill="#E26A4B" />
    <!-- Subtitle -->
    <text x="2" y="78" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#8B8B8B">ACTION INTO PROGRESS</text>
  </g>
</svg>
