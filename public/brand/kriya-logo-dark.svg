<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="460" height="140" fill="none">
  <!-- KRIYA Dark Background Logo -->
  <rect width="460" height="140" rx="16" fill="#20231F" />
  
  <g id="kriya-logo-dark" transform="translate(10, 10)">
    <!-- Brand Symbol (Scaled 2.8x) -->
    <g transform="translate(16, 15) scale(2.8)">
      <path d="M 4 6 L 6 4 L 11 4 L 11 28 L 4 28 Z" fill="#E26A4B" />
      <path d="M 9.5 4 L 11 4 L 11 28 L 9.5 28 Z" fill="#C85A3D" opacity="0.6" />
      
      <!-- Progress Steps -->
      <rect x="12" y="15" width="5" height="4" rx="0.5" fill="#E26A4B" />
      <rect x="17" y="10" width="5" height="5" rx="0.5" fill="#E26A4B" />
      <rect x="22" y="4" width="6" height="6" rx="0.5" fill="#F5B731" />
      <rect x="26" y="2" width="2" height="2" fill="#85B592" />

      <!-- Foundation Steps -->
      <rect x="12" y="19" width="6" height="4" rx="0.5" fill="#C85A3D" />
      <rect x="18" y="23" width="7" height="5" rx="0.5" fill="#C85A3D" />
    </g>

    <!-- Wordmark & Typography -->
    <g transform="translate(116, 0)">
      <text x="0" y="66" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#FFFDF7">KRIYA</text>
      <rect x="154" y="28" width="6" height="6" fill="#E26A4B" rx="1" />
      <text x="2" y="90" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="#DFDDD2">DAILY PROGRESS ENGINE</text>
    </g>
  </g>
</svg>
